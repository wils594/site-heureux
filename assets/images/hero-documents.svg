<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1000" role="img" aria-labelledby="t d">
  <title id="t">Passeport togolais et documents administratifs fictifs sur un bureau</title>
  <desc id="d">Rendu illustratif : un passeport à couverture verte portant la mention République togolaise, un certificat fictif marqué spécimen et un dossier, disposés sur un bureau en bois clair.</desc>
  <defs>
    <linearGradient id="desk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9c3a0"/><stop offset="0.5" stop-color="#c9ae86"/><stop offset="1" stop-color="#b99a70"/>
    </linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a7a56"/><stop offset=".55" stop-color="#00573f"/><stop offset="1" stop-color="#003a2b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0a8"/><stop offset=".5" stop-color="#e8b923"/><stop offset="1" stop-color="#f7d95a"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf7"/><stop offset="1" stop-color="#f0ead9"/>
    </linearGradient>
    <linearGradient id="folder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8dcc0"/><stop offset="1" stop-color="#d4c4a0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#3a2a10" flood-opacity=".35"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#3a2a10" flood-opacity=".25"/>
    </filter>
    <pattern id="grain" width="60" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(-8)">
      <rect width="60" height="14" fill="none"/>
      <path d="M0 4 Q15 2 30 5 T60 4" stroke="#8a6c40" stroke-opacity=".12" fill="none"/>
      <path d="M0 10 Q18 12 34 9 T60 10" stroke="#fff" stroke-opacity=".08" fill="none"/>
    </pattern>
    <pattern id="guilloche" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="9" fill="none" stroke="#e0b21a" stroke-opacity=".35"/>
      <circle cx="12" cy="12" r="5" fill="none" stroke="#006a4a" stroke-opacity=".25"/>
    </pattern>
    <pattern id="weave" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 0H8" stroke="#000" stroke-opacity=".12"/><path d="M0 4H8" stroke="#fff" stroke-opacity=".05"/>
    </pattern>
  </defs>

  <!-- bureau -->
  <rect width="900" height="1000" fill="url(#desk)"/>
  <rect width="900" height="1000" fill="url(#grain)"/>
  <rect width="900" height="1000" fill="url(#light)"/>

  <!-- dossier -->
  <g transform="translate(90 470) rotate(-6 340 230)" filter="url(#shadow)">
    <rect x="0" y="20" width="640" height="440" rx="14" fill="#cdbb94"/>
    <path d="M0 34 q0-14 14-14 h210 q16 0 24 12 l14 20 h364 q14 0 14 14 v394 q0 14-14 14 H14 q-14 0-14-14z" fill="url(#folder)"/>
  </g>

  <!-- certificat fictif (spécimen) -->
  <g transform="translate(130 120) rotate(-5 300 330)" filter="url(#shadow)">
    <rect width="600" height="760" rx="8" fill="url(#paper)"/>
    <rect x="22" y="22" width="556" height="716" rx="4" fill="url(#guilloche)" opacity=".7"/>
    <rect x="22" y="22" width="556" height="716" rx="4" fill="none" stroke="#e0b21a" stroke-width="3"/>
    <rect x="34" y="34" width="532" height="692" rx="2" fill="none" stroke="#006a4a" stroke-width="1.2" stroke-opacity=".6"/>
    <!-- bandeau tricolore vert / jaune / rouge -->
    <g>
      <rect x="34" y="34" width="177" height="14" fill="#006a4a"/>
      <rect x="211" y="34" width="178" height="14" fill="#ffce00"/>
      <rect x="389" y="34" width="177" height="14" fill="#d21034"/>
    </g>
    <circle cx="300" cy="118" r="38" fill="none" stroke="url(#gold)" stroke-width="4"/>
    <circle cx="300" cy="118" r="24" fill="#006a4a" fill-opacity=".92"/>
    <path d="M300 100 l5 11 12 1-9 8 3 12-11-6-11 6 3-12-9-8 12-1z" fill="#fff"/>
    <rect x="170" y="184" width="260" height="14" rx="3" fill="#00573f" opacity=".85"/>
    <rect x="215" y="212" width="170" height="9" rx="3" fill="#00573f" opacity=".45"/>
    <!-- lignes de texte neutres (aucune donnée lisible) -->
    <g fill="#2b3a35" opacity=".28">
      <rect x="80" y="278" width="440" height="9" rx="4"/>
      <rect x="80" y="304" width="400" height="9" rx="4"/>
      <rect x="80" y="330" width="430" height="9" rx="4"/>
      <rect x="80" y="356" width="360" height="9" rx="4"/>
      <rect x="80" y="408" width="440" height="9" rx="4"/>
      <rect x="80" y="434" width="410" height="9" rx="4"/>
      <rect x="80" y="460" width="425" height="9" rx="4"/>
      <rect x="80" y="486" width="300" height="9" rx="4"/>
      <rect x="80" y="538" width="440" height="9" rx="4"/>
      <rect x="80" y="564" width="390" height="9" rx="4"/>
    </g>
    <!-- cachet générique -->
    <g transform="translate(430 625)">
      <circle r="60" fill="url(#gold)" opacity=".92"/>
      <circle r="48" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="2" stroke-dasharray="3 4"/>
      <circle r="30" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="2"/>
      <path d="M-14 4 l10 10 22-26" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <path d="M90 658 H260" stroke="#2b3a35" stroke-opacity=".4" stroke-width="1.5"/>
    <rect x="90" y="670" width="110" height="7" rx="3" fill="#2b3a35" opacity=".2"/>
    <!-- mention spécimen -->
    <text x="300" y="440" text-anchor="middle" transform="rotate(-24 300 440)" font-family="Georgia, 'Times New Roman', serif" font-size="92" letter-spacing="10" fill="#d21034" fill-opacity=".10">SPÉCIMEN</text>
  </g>

  <!-- passeport à couverture verte -->
  <g transform="translate(470 360) rotate(9 190 270)" filter="url(#shadow)">
    <rect width="380" height="540" rx="18" fill="url(#cover)"/>
    <rect width="380" height="540" rx="18" fill="url(#weave)"/>
    <rect x="3" y="3" width="374" height="534" rx="16" fill="none" stroke="#fff" stroke-opacity=".14" stroke-width="2"/>
    <rect x="0" y="0" width="14" height="540" rx="7" fill="#001a12" opacity=".5"/>
    <!-- mentions dorées -->
    <text x="190" y="78" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="21" letter-spacing="6" fill="url(#gold)">CEDEAO · ECOWAS</text>
    <text x="190" y="122" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="25" letter-spacing="3" fill="url(#gold)">RÉPUBLIQUE TOGOLAISE</text>
    <!-- emblème générique : étoile dans un cercle (rappel du drapeau) -->
    <g transform="translate(190 232)">
      <circle r="62" fill="none" stroke="url(#gold)" stroke-width="4.5"/>
      <circle r="50" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity=".7"/>
      <path d="M0 -36 l10.600 23.500 25.600 2.700-19.200 17.300 5.400 25.200L0 18.500l-22.400 13 5.400-25.200-19.200-17.300 25.600-2.700z" fill="url(#gold)"/>
    </g>
    <text x="190" y="352" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="34" letter-spacing="9" fill="url(#gold)">PASSEPORT</text>
    <text x="190" y="384" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" letter-spacing="7" fill="url(#gold)" opacity=".85">PASSPORT</text>
    <!-- symbole de passeport biométrique -->
    <g transform="translate(190 458)">
      <rect x="-30" y="-19" width="60" height="38" rx="8" fill="none" stroke="url(#gold)" stroke-width="3"/>
      <circle r="7" fill="none" stroke="url(#gold)" stroke-width="3"/>
      <circle r="13" fill="none" stroke="url(#gold)" stroke-width="2" opacity=".6"/>
    </g>
    <rect width="380" height="540" rx="18" fill="url(#light)" opacity=".5"/>
  </g>

  <!-- stylo -->
  <g transform="translate(110 900) rotate(-18)" filter="url(#soft)">
    <rect width="300" height="16" rx="8" fill="#00362a"/>
    <rect x="240" width="14" height="16" fill="url(#gold)"/>
    <path d="M300 0 l34 8 -34 8z" fill="#2a2a2a"/>
    <rect x="12" y="3" width="200" height="3" rx="1.5" fill="#fff" opacity=".25"/>
  </g>

  <!-- trombone -->
  <path d="M740 140 v70 a14 14 0 0 1 -28 0 v-80 a22 22 0 0 1 44 0 v85" fill="none" stroke="#9aa3a0" stroke-width="5" stroke-linecap="round" transform="rotate(12 740 180)" filter="url(#soft)"/>
</svg>
